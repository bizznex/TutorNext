name: Mountain Plan — Daily Coach

on:
  schedule:
    # 09:00 Asia/Kolkata (IST is UTC+05:30 and has no daylight saving time).
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Optional plan date to run (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: mountain-plan-daily
  cancel-in-progress: false

jobs:
  daily-coach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plan
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Mountain_plan/requirements.txt

      - name: Install workbook reader
        run: python -m pip install -r Mountain_plan/requirements.txt

      - name: Validate coach
        run: python -m unittest discover -s Mountain_plan -p "test_*.py"

      - name: Create today's coach issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOUNTAIN_ASSIGNEE: rickdatascientist
          RUN_DATE: ${{ inputs.run_date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            python Mountain_plan/mountain_agent.py --date "$RUN_DATE"
          else
            python Mountain_plan/mountain_agent.py
          fi
